name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *" # roda todo dia à meia-noite (UTC)
  workflow_dispatch: {} # permite rodar manualmente em Actions > Generate Snake > Run workflow
  push:
    branches: ["main"]

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Gera o SVG da cobrinha a partir do grid de contribuições
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: kauancomper
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publica os SVGs gerados na branch "output"
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUBB_TOKEN: ${{ secrets.GITHUBB_TOKEN }}
